<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)" />
    <title>Offline | NexTep Edu</title>
    <style>
        :root {
            --bg: #F8F9FA;
            --fg: #1E293B;
            --primary: #0F172A;
            --muted: #64748B;
            --card: #FFFFFF;
            --border: #E2E8F0;
            --accent: #D4AF37;
            --accent-fg: #0F172A;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0B1120;
                --fg: #F8FAFC;
                --primary: #F8FAFC;
                --muted: #94A3B8;
                --card: #151F32;
                --border: rgba(255, 255, 255, 0.1);
                --accent: #D4AF37;
                --accent-fg: #0F172A;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .surface-card {
            width: 100%;
            max-width: 28rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.75rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.2);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
            text-decoration: none;
        }
        .brand img {
            width: 28px;
            height: 28px;
            border-radius: 0.5rem;
            object-fit: contain;
        }
        .icon-box {
            width: 4rem;
            height: 4rem;
            border-radius: 1rem;
            background: rgba(212, 175, 55, 0.14);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        h1 {
            font-size: 1.625rem;
            line-height: 1.2;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.625rem;
        }
        p.desc {
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        .btn-primary {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 0.75rem;
            background: var(--accent);
            color: var(--accent-fg);
            font-weight: 700;
            font-size: 0.9375rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            touch-action: manipulation;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
        }
        .btn-outline {
            min-height: 44px;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.8125rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            touch-action: manipulation;
        }
        .footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.6;
        }
        .footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="surface-card">
        <a href="/" class="brand">
            <img src="/assets/logo.png" alt="NexTep Edu Logo" />
            <span>NexTep Edu</span>
        </a>
        <div class="icon-box" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="2" x2="22" y2="22"></line>
                <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
                <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
                <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
                <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
                <path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>You're Currently Offline</h1>
        <p class="desc">
            Your internet connection dropped. Reconnect to mobile data or Wi-Fi to load the latest country guides, application status, and document uploads.
        </p>
        <div class="actions">
            <button type="button" class="btn-primary" onclick="window.location.reload()">
                Try Again
            </button>
            <div class="row">
                <a href="/" class="btn-outline">Home</a>
                <a href="/destinations" class="btn-outline">Destinations</a>
            </div>
        </div>
        <div class="footer">
            <p>Need urgent counselor support once back online?</p>
            <a href="https://wa.me/4915147483493" target="_blank" rel="noopener noreferrer">
                WhatsApp: +49 151 47483493
            </a>
        </div>
    </main>
</body>
</html>
